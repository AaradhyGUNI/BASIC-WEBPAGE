<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator — Final</title>
  <link rel="stylesheet" href="interface.css" />
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" placeholder="0" readonly />

    <div class="buttons" id="buttons">
      <!-- row 1 -->
      <button class="ctrl" data-key="Escape" data-action="ac">AC</button>
      <button class="ctrl" data-key="Backspace" data-action="del">DEL</button>
      <button class="operator" data-key="%">%</button>
      <button class="operator" data-key="/">÷</button>

      <!-- row 2 -->
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="operator" data-key="*">×</button>

      <!-- row 3 -->
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="operator" data-key="-">−</button>

      <!-- row 4 -->
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>

      <!-- equal button (spans row 4 & 5) -->
      <button class="equal" data-key="Enter" data-action="equals">=</button>

      <!-- row 5 -->
      <button data-key="0">0</button>
      <button data-key="0" data-raw="00">00</button>
      <button data-key=".">.</button>
    </div>
  </div>

  <script src="caljs.js"></script>
</body>
</html>
